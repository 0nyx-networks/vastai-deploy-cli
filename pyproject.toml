[project]
name = "vastai-deploy-cli"
version = "0.1.0"
description = "Deploy GPU containers to Vast.ai with Tailscale auth-key provisioning"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.27",
    "httpx>=0.27",          # used by Tailscale client
    "vastai>=0.3",          # official Vast.ai SDK (provides VastAI class)
    "pydantic>=2.5",
    "pydantic-settings>=2.1",
    "typer>=0.12",
    "rich>=13.7",
    "python-dotenv>=1.0",
]

[project.scripts]
vastai-cli = "app.cli:app"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]
